name: iris
description: "Trial Reels production, review and publishing client."
publish_to: 'none'

version: 1.0.46+55

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  app_links: ^6.4.1
  video_player: ^2.9.5
  file_picker: ^12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  video_player_platform_interface: ^6.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/doctor-icon.png
  fonts:
    # Content Doctor UI typography. These official Google Fonts variable
    # TTFs expose the full weight axis used by the source UI (Inter 400-900;
    # JetBrains Mono 400/500) and remain bundled for offline/iOS rendering.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    # Caption rendering families used by the native editor.
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed-Regular.ttf
    - family: DejaVuSansCondensed
      fonts:
        - asset: assets/fonts/DejaVuSansCondensed.ttf

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/doctor-icon.png"
  remove_alpha_ios: true
  background_color_ios: "#131515"
