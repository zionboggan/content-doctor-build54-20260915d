name: App Store screenshots
on:
  push:
    branches: [release56-capture]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - name: Prepare private reviewer configuration
        env:
          REVIEW_CONFIG: ${{ secrets.APP_REVIEW_CAPTURE_CONFIG }}
        run: |
          python3 - <<'PY'
          import os,json,base64
          from pathlib import Path
          raw=os.environ['REVIEW_CONFIG']
          data=json.loads(raw)
          for key,value in data.items():
              print('::add-mask::'+str(value))
              print('::add-mask::'+base64.b64encode((key+'='+str(value)).encode()).decode())
          path=Path(os.environ['RUNNER_TEMP'])/'review-config.json'
          path.write_text(raw);path.chmod(0o600)
          PY
      - name: Select and boot required simulator
        env:
          CAPTURE_FAMILY: ${{ matrix.device }}
        run: |
          python3 - <<'PY'
          import json,subprocess,os
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))
          devices=[d for values in data['devices'].values() for d in values if d.get('isAvailable')]
          chosen=None
          names=('iPhone 16 Pro Max','iPhone 17 Pro Max','iPhone 16 Plus') if os.environ['CAPTURE_FAMILY']=='iphone' else ('iPad Pro 13-inch (M5)','iPad Pro 13-inch (M4)','iPad Air 13-inch (M3)')
          for name in names:
              chosen=next((d for d in devices if d['name']==name),None)
              if chosen:break
          if chosen is None:raise SystemExit('No supported simulator available: '+str([d['name'] for d in devices]))
          if chosen['state']!='Booted':subprocess.run(['xcrun','simctl','boot',chosen['udid']],check=True)
          subprocess.run(['xcrun','simctl','bootstatus',chosen['udid'],'-b'],check=True)
          subprocess.run(['xcrun','simctl','status_bar',chosen['udid'],'override','--time','9:41','--batteryState','charged','--batteryLevel','100'],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('CAPTURE_DEVICE='+chosen['udid']+'\n')
          print('Capturing actual simulator:',chosen['name'])
          PY
      - run: flutter pub get
      - name: Capture actual app screens with live reviewer login
        run: |
          flutter drive --driver=test_driver/app_store_capture.dart --target=integration_test/app_store_capture_test.dart -d "$CAPTURE_DEVICE" --dart-define-from-file="$RUNNER_TEMP/review-config.json"
      - name: Upload screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-store-${{ matrix.device }}-screenshots
          path: app-store-captures/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Remove ephemeral capture configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/review-config.json"
